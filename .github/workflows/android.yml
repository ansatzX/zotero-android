name: Zotero Android CI build

on:
  push:
    # Pattern matched against refs/tags
    branches:
      - tag-1.0.0-175

    tags:
      - '**'  # Push events to every tag including hierarchical tags like v1.0/beta

env:
  ANDROID_PUBLISHER_CREDENTIALS: zxm
jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: gradle

      - name: set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Writing PSPDFKIT's key into a file to be then picked up by gradle.
        run: echo 'e367206c7338a2f2bbf484aabbd2cbc37ff8ce18124f0c541cf1b482cb04c336' | sed 's/./& /g' > pspdfkit-key.txt

      - name: Decrypt Keystore
        run: openssl aes-256-cbc -d -in .github/keystore.cipher -k 'e367206c7338a2f2bbf484aabbd2cbc37ff8ce18124f0c541cf1b482cb04c336' -md sha256 > zotero.release.keystore

      - name: Decrypt Keystore secrets
        run: openssl aes-256-cbc -d -in .github/keystore-secrets.cipher -k 'e367206c7338a2f2bbf484aabbd2cbc37ff8ce18124f0c541cf1b482cb04c336' -md sha256 > keystore-secrets.txt

      - name: Grant execute permission for bundle_translators.py
        run: chmod +x scripts/bundle_translators.py

      - name: Execute bundle_translators.py
        run: python3 scripts/bundle_translators.py

      - name: Grant execute permission for bundle_translation.py
        run: chmod +x scripts/bundle_translation.py

      - name: Execute bundle_translation.py
        run: python3 scripts/bundle_translation.py

      - name: Grant execute permission for bundle_pdf-worker.py
        run: chmod +x scripts/bundle_pdf-worker.py

      - name: Execute bundle_pdf-worker.py
        run: python3 scripts/bundle_pdf-worker.py

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Download Android dependencies
        run: ./gradlew androidDependencies --no-configuration-cache


      - name: Build APK
        run: ./gradlew assembleRelease


      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
          
